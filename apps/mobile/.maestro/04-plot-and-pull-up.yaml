# Plans (F-EVT-01/02/05/15): a verified seeded member plots a plan through place search, sees it in
# Hosting, opens who's pulling up and their check-in code. Seed member #3 (+91 90000 10003) is verified.
appId: app.touchgrass
name: Plot a plan and manage it
---
- launchApp:
    clearState: true
- tapOn: 'Get started'
- tapOn:
    id: phone-input
- inputText: '9000010003'
- tapOn: 'Send code'
- tapOn:
    id: otp-input
- inputText: '000000'
- tapOn: 'Verify'
- runFlow: subflows/skip-after-prompt.yaml
- tapOn: 'Plans'
- assertVisible: 'Your plans'
- tapOn:
    id: plot-cta
- tapOn:
    id: plot-title
- inputText: 'Maestro chai walk'
# Category is a setting row that opens a searchable list (D-189, D-199). With the keyboard up the screen
# now shrinks above it (D-222), so close the keyboard first (it is open here, so this is not a Back press),
# as a person would; scrolling instead closes it mid-drag and can overshoot the row.
- hideKeyboard
- tapOn:
    id: plot-category
- tapOn:
    id: plot-category-search
- inputText: 'Chai'
- tapOn: '.*Chai runs.*'
# Where is a setting row too: place search opens in a sheet that stays above the keyboard.
- scrollUntilVisible:
    element:
      id: plot-where
    direction: DOWN
- tapOn:
    id: plot-where
- tapOn:
    id: plot-place-search
- inputText: 'mall'
- scrollUntilVisible:
    element:
      id: 'place-.*'
    direction: DOWN
- tapOn:
    id: 'place-.*'
    index: 0
- assertVisible:
    id: plot-picked
- scrollUntilVisible:
    element: 'Tomorrow'
    direction: DOWN
- tapOn: 'Tomorrow'
# The main button is pinned at the bottom, so it needs no scrolling.
- tapOn:
    id: plot-submit
# First-time hosts agree once to "No payments outside TouchGrass" (D-228); later runs skip it.
- runFlow:
    when:
      visible:
        id: host-rules-agree
    commands:
      - tapOn:
          id: host-rules-agree
- assertVisible: 'Maestro chai walk'
- assertVisible: "You're hosting."
- scrollUntilVisible:
    element:
      id: who-is-going
- tapOn:
    id: who-is-going
- assertVisible: "Who's pulling up"
- back
# Hosts check guests in; they have no check-in code of their own.
# Edit sits just below Scan (48dp buttons on Android), so scroll to it and check both.
- scrollUntilVisible:
    element: 'Edit plan'
    direction: DOWN
- assertVisible: 'Scan check-ins'
# Their new plan is listed on Plans (Upcoming and Hosting rows).
- back
- tapOn:
    id: dock-plans
- scrollUntilVisible:
    element: 'Hosting'
    direction: DOWN
# Keep scrolling until the new plan's own title is on screen, not just the row heading.
- scrollUntilVisible:
    element: 'Maestro chai walk'
    direction: DOWN
- assertVisible: 'Maestro chai walk'
